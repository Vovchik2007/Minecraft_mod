
name: Build Nocturne Stonebound

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source archive
        run: |
          unzip -q Nocturne_Stonebound_Forge_Source.zip -d extracted
          echo "PROJECT_DIR=extracted/Nocturne_Stonebound_1.20.1_Forge" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Stonebound-Forge-1.20.1
          path: extracted/Nocturne_Stonebound_1.20.1_Forge/build/libs/*.jar
          if-no-files-found: error
